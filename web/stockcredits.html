<script id="vrCredits">
/* Атрибуция стоков (правила Pexels/Pixabay): автор под клипом каждой сцены,
   «Кадры: Pexels · Pixabay» в выборе клипа, титры авторов под готовым роликом. */
(function(){
  function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function link(u,t){return /^https:\/\//.test(u||'')?'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(t)+'</a>':esc(t);}
  function credit(c){ if(!c)return ''; return (c.author?link(c.author_url,c.author)+' / ':'')+link(c.page,c.source); }
  function canApi(){ return typeof api==='function'&&(typeof ready!=='function'||ready()); }
  function sceneCredit(th,i,again){
    const card=th&&th.closest&&th.closest('.sbscene');
    if(!card){ if(!again&&th)setTimeout(function(){sceneCredit(th,i,1);},0); return; }   // карточка ещё собирается
    if(card.classList.contains('cta'))return;
    const main=card.querySelector('.sbmain')||card;
    let cr=document.getElementById('sbcr'+i);
    if(!cr||!main.contains(cr)){ if(cr)cr.remove(); cr=document.createElement('div'); cr.id='sbcr'+i; cr.className='vrCredit'; main.appendChild(cr); }
    cr.innerHTML=''; if(!canApi())return;
    api('scene_credit',i).then(function(c){ cr.innerHTML=c?('🎞 Видео: '+credit(c)):''; }).catch(function(){});
  }
  function wrap(name,after){
    const f=window[name]; if(typeof f!=='function'||f.__vrc)return;
    const g=function(){ const r=f.apply(this,arguments); try{after.apply(this,arguments);}catch(e){} return r; };
    g.__vrc=1; window[name]=g;
  }
  function hook(){
    wrap('fillThumb',function(th,i){ sceneCredit(th,i); });
    wrap('renderSwapCands',function(){
      const g=document.getElementById('swapPickGrid'); if(!g||!g.parentNode)return;
      let d=g.parentNode.querySelector('.vrSwapCredit');
      if(!d){ d=document.createElement('div'); d.className='vrSwapCredit'; g.parentNode.insertBefore(d,g.nextSibling); }
      d.innerHTML='Кадры: '+link('https://www.pexels.com','Pexels')+' · '+link('https://pixabay.com','Pixabay')+' · '+link('https://commons.wikimedia.org','Wikimedia Commons');
    });
  }
  // галочка «Наши ключи» (общие клипы + ИИ, с лимитом в час) + блок ключей Groq
  // окно лицензии: с галочкой «Наши ключи» триал без ключей — только кнопка
  function trialMode(st){ const on=!!(st&&st.on&&st.ready); document.documentElement.classList.toggle('vrSharedOn',on);
    document.querySelectorAll('[data-i18n="lic_trial_desc"]').forEach(function(el){
      if(el.dataset.vrOrig==null)el.dataset.vrOrig=el.textContent;
      if(on) el.textContent='1 бесплатное видео — все ключи уже подключены, просто нажми кнопку.';
      else el.textContent=el.dataset.vrOrig+((st&&st.ready)?(' Или поставь галочку «Наши ключи» на главной и пользуйся нашими ключами — '+limitText(st)+'.'):''); }); }
  function limitText(st){ return 'без лимита, при нагрузке — короткая очередь'; }
  function refreshAll(){ try{ if(typeof loadKeysStatus==='function')loadKeysStatus(); }catch(e){}
    try{ api('get_reel_ai').then(function(r){ if(!r)return; window.__vrFreeIsGroq=!!r.free_groq; if(typeof renderReelAi==='function')renderReelAi(r.has_claude,r.has_gemini); }); }catch(e){} }
  function sharedBox(){
    const panel=document.querySelector('.kmpanel'); if(!panel||panel.querySelector('.vrShared')||!canApi())return;
    api('get_shared_state').then(function(st){
      if(!st||!st.ready||panel.querySelector('.vrShared'))return;
      const b=document.createElement('div'); b.className='vrShared';
      b.innerHTML='<label><input type="checkbox" id="vrSharedChk"> Наши ключи — клипы и ИИ уже подключены</label><div class="hint" id="vrSharedHint"></div>';
      const h3=panel.querySelector('h3'); panel.insertBefore(b,h3?h3.nextSibling:panel.firstChild);
      const chk=b.querySelector('#vrSharedChk'), hint=b.querySelector('#vrSharedHint');
      const paint=function(st){ window.__vrShared=st; trialMode(st); chk.checked=!!st.on; hint.textContent=st.on?('С галочкой работают наши ключи (Pexels, Pixabay, Groq, Gemini) — '+limitText(st)+'. Сними её — будут работать только твои ключи ниже, без очереди.'):('Работают только твои ключи, без очереди. Поставь галочку, чтобы пользоваться нашими ('+limitText(st)+').'); };
      paint(st);
      chk.onchange=function(){ api('set_use_shared',chk.checked).then(function(s2){ paint(s2); stockOpt(true); refreshAll(); }); };
    }).catch(function(){});
  }
  function stockOpt(force){
    ['px2AccBody','pxbayAccBody'].forEach(function(id){
      const body=document.getElementById(id); const inner=body&&(body.querySelector('.acc-inner')||body); if(!inner)return;
      let d=inner.querySelector('.vrStockOpt'); if(d&&!force)return;
      if(!d){ d=document.createElement('div'); d.className='vrStockOpt'; inner.insertBefore(d,inner.firstChild); }
      d.textContent='✅ Необязательно: с галочкой «Наши ключи» клипы идут через наш ключ. Свой ключ работает, когда галочка снята.';
    });
  }
  function groqBox(){
    const gem=document.getElementById('gemAccBody'); if(!gem||document.getElementById('groqAccHead')||!canApi())return;
    const head=document.createElement('button'); head.className='acc-head kacc-head'; head.id='groqAccHead'; head.type='button';
    head.innerHTML='<span class="acc-title"><span class="kmi">⚡</span> <b>Groq</b> <span class="keydot" id="groqDot">🔴</span></span><span class="arrow" id="groqArrow">▼</span>';
    head.onclick=function(){ toggleAcc('groq'); };
    const body=document.createElement('div'); body.className='acc-body'; body.id='groqAccBody';
    body.innerHTML='<div class="acc-inner"><div class="hint" style="margin-bottom:6px">Groq · бесплатный AI для текста <span id="groqCount" style="font-size:11px"></span></div><div class="hint" style="font-size:12px;margin-bottom:6px">Необязательно: с галочкой «Наши ключи» работает наш ИИ. Свой ключ Groq — когда галочка снята.</div><div id="vrGroqList" class="keylist"></div><div class="hint" style="margin:8px 0 4px">➕ Добавить ключ:</div><input type="password" id="vrGroqKey" class="fld" style="width:100%" placeholder="gsk_… ключ Groq" autocomplete="off"><div class="krow-btns"><button class="btn gc" id="vrGroqSave">💾 Сохранить</button><button class="btn ghost" id="vrGroqWhere">🌐 Где взять</button></div><div class="kmsg" id="vrGroqMsg"></div></div>';
    gem.parentNode.insertBefore(head,gem.nextSibling); head.parentNode.insertBefore(body,head.nextSibling);
    const list=body.querySelector('#vrGroqList'), msg=body.querySelector('#vrGroqMsg');
    const paint=function(r){ const ks=(r&&r.keys)||[]; list.innerHTML='';
      { const dt=document.getElementById('groqDot'); const tr=(typeof t==='function')?t:function(k){return k;}; dt.textContent=ks.length?tr('key_set'):tr('key_not_set'); dt.style.color=ks.length?'var(--green)':'var(--pink)'; }
      document.getElementById('groqCount').textContent=ks.length?('('+ks.length+'/'+((r&&r.max)||5)+')'):'';
      ks.forEach(function(k,i){ const row=document.createElement('div'); row.className='km'; row.style.cssText='display:flex;justify-content:space-between;align-items:center;margin-top:4px';
        row.innerHTML='<span>🔑 '+esc(k.mask)+'</span>'; const x=document.createElement('button'); x.className='btn ghost'; x.textContent='✕';
        x.onclick=function(){ api('remove_groq_key',i).then(function(r2){ paint(r2); refreshAll(); }); }; row.appendChild(x); list.appendChild(row); }); };
    api('get_groq_keys').then(paint);
    body.querySelector('#vrGroqSave').onclick=function(){ const inp=body.querySelector('#vrGroqKey'); msg.textContent='Проверяю…';
      api('add_groq_key',inp.value).then(function(r){ msg.textContent=(r&&r.msg)||''; msg.style.color=(r&&r.ok)?'var(--green)':'var(--pink)'; if(r&&r.ok)inp.value=''; paint(r); refreshAll(); }); };
    body.querySelector('#vrGroqWhere').onclick=function(){ api('open_groq_signup'); };
  }
  // выбор ИИ: одна кнопка -> список Gemini / Groq / Claude (Claude — если вставлен его ключ)
  function aiDropdown(tabsEl){
    if(!tabsEl)return;
    const tabs=[...tabsEl.querySelectorAll('.rtab')].filter(function(b){ return !/Opus/.test(b.textContent); });
    let box=tabsEl.parentNode.querySelector('.vrAiPick[data-for="'+tabsEl.id+'"]');
    if(!tabs.length){ if(box)box.remove(); return; }
    tabsEl.style.display='none';
    if(!box){ box=document.createElement('div'); box.className='vrAiPick'; box.dataset.for=tabsEl.id; tabsEl.parentNode.insertBefore(box,tabsEl.nextSibling); }
    const cur=tabs.find(function(b){ return b.classList.contains('on'); })||tabs[0];
    box.innerHTML='';
    const btn=document.createElement('button'); btn.type='button'; btn.textContent='Выбери ИИ: '+cur.textContent+' ▾'; box.appendChild(btn);
    btn.onclick=function(e){ e.stopPropagation(); let m=box.querySelector('.vrAiMenu'); if(m){ m.remove(); return; }
      m=document.createElement('div'); m.className='vrAiMenu';
      tabs.forEach(function(t){ const it=document.createElement('button'); it.type='button'; it.textContent=t.textContent; if(t===cur)it.className='on';
        it.onclick=function(ev){ ev.stopPropagation(); m.remove(); t.click(); }; m.appendChild(it); });
      box.appendChild(m);
      setTimeout(function(){ document.addEventListener('click',function off(){ if(m.parentNode)m.remove(); document.removeEventListener('click',off); }); },0); };
  }
  // сообщения интерфейса «ключ не задан» -> полная подсказка, когда галочка снята
  const KEYMSG=['ai_no_key','gem_no_key','stock_key_needed_mine','need_media_key','cm_need_media_key','cm_msg_need_media_key','m1_no_key','m2_no_key','kg_missing','trial_need_px','trial_need_gem'];
  function wrapT(){ if(typeof window.t!=='function'||window.t.__vrk)return; const t0=window.t;
    const nt=function(k){ const st=window.__vrShared; if(st&&st.ready&&!st.on&&KEYMSG.indexOf(k)>=0) return 'Нет ключей. Включите галочку «Наши ключи» на главной странице (раздел «Ключи») — наши ключи, '+limitText(st)+'. Или вставьте свои ключи Pexels, Pixabay и бесплатного ИИ (Gemini или Groq).'; return t0.apply(this,arguments); };
    nt.__vrk=1; window.t=nt; }
  // Очередь на наших ключах: «Получить результат», клип-микс, серия — сначала место в очереди
  // (4 старта в минуту на всех), при ожидании — обратный отсчёт, на нуле запуск сам.
  const QUEUED={ai_generate_reel:1,clipmix_preview:1,build_clipmix:1,build_batch:'n',batch_preview:'n',build_batch_from_preview:'n'};
  const QURL='https://videorils-tts.videorils.workers.dev/queue/join';
  function qid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,10); }
  async function qJoin(n){ let w=0, ahead=0;
    for(let i=0;i<Math.max(1,Math.min(n,10));i++){ try{ const r=await fetch(QURL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:qid()})}); const j=await r.json(); w=Math.max(w,j.wait||0); if(i===0)ahead=j.ahead||0; }catch(e){} }
    return {wait:w,ahead:ahead}; }
  function qWait(q){ return new Promise(function(res){
    if(!q||!q.wait){ res(true); return; }
    const box=document.createElement('div'); box.className='vrQueue';
    box.innerHTML='<span>⏳ Очередь на наших ключах — старт через</span><span class="t"></span><button type="button">Отмена</button>';
    document.body.appendChild(box); const tEl=box.querySelector('.t'); const end=Date.now()+q.wait*1000;
    const tick=function(){ const left=Math.max(0,Math.ceil((end-Date.now())/1000)); tEl.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
      if(left<=0){ clearInterval(iv); box.remove(); res(true); } };
    const iv=setInterval(tick,250); tick();
    box.querySelector('button').onclick=function(){ clearInterval(iv); box.remove(); res(false); }; }); }
  function wrapApi(){ if(typeof window.api!=='function'||window.api.__vrq)return; const a0=window.api;
    const na=function(method){ const args=arguments, kind=QUEUED[method], st=window.__vrShared;
      if(!kind||!st||!st.on||!st.ready) return a0.apply(this,args);
      let n=1; if(kind==='n'){ try{ n=method==='build_batch_from_preview'?5:String(args[1]||'').split('\n').filter(function(x){return x.trim();}).length||1; }catch(e){} }
      const self=this;
      return qJoin(n).then(qWait).then(function(go){ return go?a0.apply(self,args):{ok:false,msg:'Отменено — очередь'}; }); };
    na.__vrq=1; window.api=na; }
  // Правила веб-версии: только то, что реально есть в браузере (старые разделы из программ для ПК скрываем)
  function rulesWeb(){
    const body=document.querySelector('#rulesModal .modal-body'); if(!body||document.getElementById('vrRulesWeb'))return;
    const lite=!!document.querySelector('[data-i18n="rules_batch_h"]');
    const sec=function(cls,h,items){ return '<div class="rsec '+cls+'"><h4>'+h+'</h4><ul style="margin:6px 0 0 18px;padding:0">'+items.map(function(x){return '<li style="margin:4px 0">'+x+'</li>';}).join('')+'</ul></div>'; };

      'Делает вертикальные ролики 9:16 для TikTok, Reels и Shorts прямо в браузере телефона или компьютера: пишет сценарий, подбирает видео, озвучивает, ставит субтитры и собирает готовый ролик.',
      'Устанавливать ничего не нужно. Готовый ролик — кнопка «⬇ Скачать ролик».',
      lite?'Ролики до 120 секунд.':'Ролики до 40 секунд (лучше 20–40).'
    ]));
    S.push(sec('c3','⚡ БЫСТРЫЙ СТАРТ',[
      'Впиши тему или свою историю (нет идей — «💡 Идеи дня»).',
      'Выбери тип ролика или оставь «🤖 Авто», выбери длину.',
      '«🚀 Получить результат» — ИИ напишет сценарий и подберёт клипы под каждую фразу.',
      'Проверь сцены, при желании поменяй голос, стиль субтитров, музыку.',
      '«Озвучить и собрать рилс» → «⬇ Скачать ролик».'
    ]));
    S.push(sec('c1','🔑 КЛЮЧИ: «НАШИ» ИЛИ СВОИ',[
      '<b>Галочка «Наши ключи»</b> (главная → «Ключи») стоит сама. С ней клипы и ИИ уже работают — ничего получать и вставлять не нужно.',
      '<b>Свои ключи — по желанию.</b> Сними галочку и вставь свои бесплатные ключи Pexels, Pixabay и ИИ (Gemini или Groq) — тогда работают только они и без очереди. '+(lite?'До 5 ключей на сервис — сменяют друг друга сами.':'По 1 ключу на сервис.'),

    ]));
    S.push(sec('c3','⏳ ОЧЕРЕДЬ НА НАШИХ КЛЮЧАХ',[
      'На наших ключах одновременно стартуют до 4 человек в минуту.',
      'Если места заняты — внизу появится «⏳ старт через 0:45». Ничего нажимать не нужно: на нуле всё запустится само. Передумал — «Отмена».',
      'Очередь бывает на «Получить результат»'+(lite?', клип-миксе (1 место) и «Пакете» (по месту на каждый ролик; запускается целиком, когда освободятся места под все ролики)':'')+'. Сборка ролика идёт без очереди.',
      'Со своими ключами (галочка снята) очереди нет.'
    ]));
    S.push(sec('c1','🤖 «ВЫБЕРИ ИИ»',[
      'Кнопка рядом с «AI:». Нажми и выбери, кто пишет текст: <b>Gemini</b>, <b>Groq</b> или <b>Claude</b> (Claude появится, если вставлен его ключ).',
      'Если выбранный ИИ занят или упёрся в лимит — текст допишет другой, ролик не встанет.',
      'ИИ может ошибаться в фактах — проверяй перед публикацией.'
    ]));
    S.push(sec('c3','🎞 СЦЕНЫ: КЛИПЫ ПОД КОНТРОЛЕМ',[
      '▶ — посмотреть клип. «Другой клип» — выбрать замену из Pexels, Pixabay или Wikimedia.',
      '«Свой файл» — поставить своё фото или видео из галереи (для конкретных товаров, марок, мест — так точнее).',
      '«Обрезать» — выбрать нужный момент клипа. «Перегенерить» — переписать текст сцены.',
      'Значок ⚠ на сцене — подобран похожий, атмосферный кадр: прямого клипа по теме в стоке нет. Не нравится — замени.',
      'Под каждой сценой подписан автор клипа, под готовым роликом — список всех авторов (так требуют Pexels и Pixabay).'
    ]));
    S.push(sec('c1','🎙 ОЗВУЧКА',[
      '<b>Бесплатный голос</b> (Edge) — уже включён, без ключа и без лимита.',
      '<b>Piper</b> — запасной бесплатный голос, звучит чуть проще.',
