<script id="vrCredits">
/* Атрибуция стоков (правила Pexels/Pixabay): автор под клипом каждой сцены,
   «Кадры: Pexels · Pixabay» в выборе клипа, титры авторов под готовым роликом. */
(function(){
  function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function link(u,t){return /^https:\/\//.test(u||'')?'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(t)+'</a>':esc(t);}
  function credit(c){ if(!c)return ''; return (c.author?link(c.author_url,c.author)+' / ':'')+link(c.page,c.source); }
  function canApi(){ return typeof api==='function'&&(typeof ready!=='function'||ready()); }
  function isEn(){ return typeof uiLang!=='undefined'&&uiLang==='en'; }
  function L(ru,en){ return isEn()?en:ru; }
  function sceneCredit(th,i,again){
    const card=th&&th.closest&&th.closest('.sbscene');
    if(!card){ if(!again&&th)setTimeout(function(){sceneCredit(th,i,1);},0); return; }   // карточка ещё собирается
    if(card.classList.contains('cta'))return;
    const main=card.querySelector('.sbmain')||card;
    let cr=document.getElementById('sbcr'+i);
    if(!cr||!main.contains(cr)){ if(cr)cr.remove(); cr=document.createElement('div'); cr.id='sbcr'+i; cr.className='vrCredit'; main.appendChild(cr); }
    cr.innerHTML=''; if(!canApi())return;
    api('scene_credit',i).then(function(c){ cr.innerHTML=c?('🎞 '+L('Видео','Video')+': '+credit(c)):''; }).catch(function(){});
  }
  function wrap(name,after){
    const f=window[name]; if(typeof f!=='function'||f.__vrc)return;
    const g=function(){ const r=f.apply(this,arguments); try{after.apply(this,arguments);}catch(e){} return r; };
    g.__vrc=1; window[name]=g;
  }
  function hook(){
    wrap('fillThumb',function(th,i){ sceneCredit(th,i); });
    wrap('renderSwapCands',function(){
      const g=document.getElementById('swapPickGrid'); if(!g||!g.parentNode)return;
      let d=g.parentNode.querySelector('.vrSwapCredit');
      if(!d){ d=document.createElement('div'); d.className='vrSwapCredit'; g.parentNode.insertBefore(d,g.nextSibling); }
      d.innerHTML=L('Кадры','Footage')+': '+link('https://www.pexels.com','Pexels')+' · '+link('https://pixabay.com','Pixabay')+' · '+link('https://commons.wikimedia.org','Wikimedia Commons');
    });
  }
  // галочка «Наши ключи» (общие клипы + ИИ, с лимитом в час) + блок ключей Groq
  // окно лицензии: с галочкой «Наши ключи» триал без ключей — только кнопка
  function trialMode(st){ const on=!!(st&&st.on&&st.ready); document.documentElement.classList.toggle('vrSharedOn',on);
    document.querySelectorAll('[data-i18n="lic_trial_desc"]').forEach(function(el){
      if(el.dataset.vrOrig==null)el.dataset.vrOrig=el.textContent;
      if(on) el.textContent=L('1 бесплатное видео — все ключи уже подключены, просто нажми кнопку.','1 free video — all keys are already connected, just tap the button.');
      else el.textContent=el.dataset.vrOrig+((st&&st.ready)?L(' Или поставь галочку «Наши ключи» на главной и пользуйся нашими ключами — '+limitText(st)+'.',' Or tick “Our keys” on the home screen and use our keys — '+limitText(st)+'.'):''); }); }
  function limitText(st){ return L('без лимита, при нагрузке — короткая очередь','no limit, a short queue at peak times'); }
  function refreshAll(){ try{ if(typeof loadKeysStatus==='function')loadKeysStatus(); }catch(e){}
    try{ api('get_reel_ai').then(function(r){ if(!r)return; window.__vrFreeIsGroq=!!r.free_groq; if(typeof renderReelAi==='function')renderReelAi(r.has_claude,r.has_gemini); }); }catch(e){} }
  function sharedBox(){
    const panel=document.querySelector('.kmpanel'); if(!panel||panel.querySelector('.vrShared')||!canApi())return;
    api('get_shared_state').then(function(st){
      if(!st||!st.ready||panel.querySelector('.vrShared'))return;
      const b=document.createElement('div'); b.className='vrShared'; b.dataset.lang=isEn()?'en':'ru';
      b.innerHTML='<label><input type="checkbox" id="vrSharedChk"> '+L('Наши ключи — клипы и ИИ уже подключены','Our keys — clips and AI are already connected')+'</label><div class="hint" id="vrSharedHint"></div>';
      const h3=panel.querySelector('h3'); panel.insertBefore(b,h3?h3.nextSibling:panel.firstChild);
      const chk=b.querySelector('#vrSharedChk'), hint=b.querySelector('#vrSharedHint');
      const paint=function(st){ window.__vrShared=st; trialMode(st); chk.checked=!!st.on; hint.textContent=st.on?L('С галочкой работают наши ключи (Pexels, Pixabay, Groq, Gemini) — '+limitText(st)+'. Сними её — будут работать только твои ключи ниже, без очереди.','With the tick on, our keys are used (Pexels, Pixabay, Groq, Gemini) — '+limitText(st)+'. Untick it to use only your own keys below, with no queue.'):L('Работают только твои ключи, без очереди. Поставь галочку, чтобы пользоваться нашими ('+limitText(st)+').','Only your own keys are used, no queue. Tick it to use ours ('+limitText(st)+').'); };
      paint(st);
      chk.onchange=function(){ api('set_use_shared',chk.checked).then(function(s2){ paint(s2); stockOpt(true); refreshAll(); }); };
    }).catch(function(){});
  }
  function stockOpt(force){
    ['px2AccBody','pxbayAccBody'].forEach(function(id){
      const body=document.getElementById(id); const inner=body&&(body.querySelector('.acc-inner')||body); if(!inner)return;
      let d=inner.querySelector('.vrStockOpt'); if(d&&!force)return;
      if(!d){ d=document.createElement('div'); d.className='vrStockOpt'; d.dataset.lang=isEn()?'en':'ru'; inner.insertBefore(d,inner.firstChild); }
      d.textContent=L('✅ Необязательно: с галочкой «Наши ключи» клипы идут через наш ключ. Свой ключ работает, когда галочка снята.','✅ Optional: with “Our keys” ticked, clips come through our key. Your own key is used when the tick is off.');
    });
  }
  function groqBox(){
    const gem=document.getElementById('gemAccBody'); if(!gem||document.getElementById('groqAccHead')||!canApi())return;
    const head=document.createElement('button'); head.className='acc-head kacc-head'; head.id='groqAccHead'; head.type='button'; head.dataset.lang=isEn()?'en':'ru';
    head.innerHTML='<span class="acc-title"><span class="kmi">⚡</span> <b>Groq</b> <span class="keydot" id="groqDot">🔴</span></span><span class="arrow" id="groqArrow">▼</span>';
    head.onclick=function(){ toggleAcc('groq'); };
    const body=document.createElement('div'); body.className='acc-body'; body.id='groqAccBody'; body.dataset.lang=isEn()?'en':'ru';
    body.innerHTML='<div class="acc-inner"><div class="hint" style="margin-bottom:6px">'+L('Groq · бесплатный AI для текста','Groq · free AI for text')+' <span id="groqCount" style="font-size:11px"></span></div><div class="hint" style="font-size:12px;margin-bottom:6px">'+L('Необязательно: с галочкой «Наши ключи» работает наш ИИ. Свой ключ Groq — когда галочка снята.','Optional: with “Our keys” ticked, our AI is used. Your own Groq key — when the tick is off.')+'</div><div id="vrGroqList" class="keylist"></div><div class="hint" style="margin:8px 0 4px">➕ '+L('Добавить ключ:','Add a key:')+'</div><input type="password" id="vrGroqKey" class="fld" style="width:100%" placeholder="gsk_… '+L('ключ Groq','Groq key')+'" autocomplete="off"><div class="krow-btns"><button class="btn gc" id="vrGroqSave">💾 '+L('Сохранить','Save')+'</button><button class="btn ghost" id="vrGroqWhere">🌐 '+L('Где взять','Get a key')+'</button></div><div class="kmsg" id="vrGroqMsg"></div></div>';
    gem.parentNode.insertBefore(head,gem.nextSibling); head.parentNode.insertBefore(body,head.nextSibling);
    const list=body.querySelector('#vrGroqList'), msg=body.querySelector('#vrGroqMsg');
    const paint=function(r){ const ks=(r&&r.keys)||[]; list.innerHTML='';
      { const dt=document.getElementById('groqDot'); const tr=(typeof t==='function')?t:function(k){return k;}; dt.dataset.n=ks.length; dt.textContent=ks.length?tr('key_set'):tr('key_not_set'); dt.style.color=ks.length?'var(--green)':'var(--pink)'; }
      document.getElementById('groqCount').textContent=ks.length?('('+ks.length+'/'+((r&&r.max)||5)+')'):'';
      ks.forEach(function(k,i){ const row=document.createElement('div'); row.className='km'; row.style.cssText='display:flex;justify-content:space-between;align-items:center;margin-top:4px';
        row.innerHTML='<span>🔑 '+esc(k.mask)+'</span>'; const x=document.createElement('button'); x.className='btn ghost'; x.textContent='✕';
        x.onclick=function(){ api('remove_groq_key',i).then(function(r2){ paint(r2); refreshAll(); }); }; row.appendChild(x); list.appendChild(row); }); };
    api('get_groq_keys').then(paint);
    body.querySelector('#vrGroqSave').onclick=function(){ const inp=body.querySelector('#vrGroqKey'); msg.textContent=L('Проверяю…','Checking…');
      api('add_groq_key',inp.value).then(function(r){ msg.textContent=(r&&r.msg)||''; msg.style.color=(r&&r.ok)?'var(--green)':'var(--pink)'; if(r&&r.ok)inp.value=''; paint(r); refreshAll(); }); };
    body.querySelector('#vrGroqWhere').onclick=function(){ api('open_groq_signup'); };
  }
  // выбор ИИ: одна кнопка -> список Gemini / Groq / Claude (Claude — если вставлен его ключ)
  function aiDropdown(tabsEl){
    if(!tabsEl)return;
    const tabs=[...tabsEl.querySelectorAll('.rtab')].filter(function(b){ return !/Opus/.test(b.textContent); });
    let box=tabsEl.parentNode.querySelector('.vrAiPick[data-for="'+tabsEl.id+'"]');
    if(!tabs.length){ if(box)box.remove(); return; }
    tabsEl.style.display='none';
    if(!box){ box=document.createElement('div'); box.className='vrAiPick'; box.dataset.for=tabsEl.id; tabsEl.parentNode.insertBefore(box,tabsEl.nextSibling); }
    const cur=tabs.find(function(b){ return b.classList.contains('on'); })||tabs[0];
    box.innerHTML='';
    const btn=document.createElement('button'); btn.type='button'; btn.textContent=L('Выбери ИИ','Choose AI')+': '+cur.textContent+' ▾'; box.appendChild(btn);
    btn.onclick=function(e){ e.stopPropagation(); let m=box.querySelector('.vrAiMenu'); if(m){ m.remove(); return; }
      m=document.createElement('div'); m.className='vrAiMenu';
      tabs.forEach(function(t){ const it=document.createElement('button'); it.type='button'; it.textContent=t.textContent; if(t===cur)it.className='on';
        it.onclick=function(ev){ ev.stopPropagation(); m.remove(); t.click(); }; m.appendChild(it); });
      box.appendChild(m);
      setTimeout(function(){ document.addEventListener('click',function off(){ if(m.parentNode)m.remove(); document.removeEventListener('click',off); }); },0); };
  }
  // сообщения интерфейса «ключ не задан» -> полная подсказка, когда галочка снята
  const KEYMSG=['ai_no_key','gem_no_key','stock_key_needed_mine','need_media_key','cm_need_media_key','cm_msg_need_media_key','m1_no_key','m2_no_key','kg_missing','trial_need_px','trial_need_gem'];
  function wrapT(){ if(typeof window.t!=='function'||window.t.__vrk)return; const t0=window.t;
    const nt=function(k){ const st=window.__vrShared;
      if(k==='pay_pending'&&!isEn()) return '⏳ Оплата пока не поступила. Если уже оплатил картой — подожди минуту и нажми «Проверить» ещё раз.';   // RU — оплата картой, не крипта
      if(st&&st.ready&&!st.on&&KEYMSG.indexOf(k)>=0) return L('Нет ключей. Включите галочку «Наши ключи» на главной странице (раздел «Ключи») — наши ключи, '+limitText(st)+'. Или вставьте свои ключи Pexels, Pixabay и бесплатного ИИ (Gemini или Groq).','No keys. Turn on the “Our keys” tick on the home screen (the “Keys” section) — our keys, '+limitText(st)+'. Or paste your own Pexels, Pixabay and free AI (Gemini or Groq) keys.'); const out=t0.apply(this,arguments); return (typeof out==='string')?out.replace(/на этом ПК/g,'в этом браузере').replace(/this PC/g,'this browser'):out; };
    nt.__vrk=1; window.t=nt; }
  // Очередь на наших ключах: «Получить результат», клип-микс, серия — сначала место в очереди
  // (4 старта в минуту на всех), при ожидании — обратный отсчёт, на нуле запуск сам.
  const QUEUED={ai_generate_reel:1,clipmix_preview:1,build_clipmix:1,build_batch:'n',batch_preview:'n',build_batch_from_preview:'n'};
  const QURL='https://videorils-tts.videorils.workers.dev/queue/join';
  function qid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,10); }
  async function qJoin(n){ let w=0, ahead=0;
    for(let i=0;i<Math.max(1,Math.min(n,10));i++){ try{ const r=await fetch(QURL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:qid()})}); const j=await r.json(); w=Math.max(w,j.wait||0); if(i===0)ahead=j.ahead||0; }catch(e){} }
    return {wait:w,ahead:ahead}; }
  function qWait(q){ return new Promise(function(res){
    if(!q||!q.wait){ res(true); return; }
    const box=document.createElement('div'); box.className='vrQueue';
    box.innerHTML='<span>⏳ '+L('Очередь на наших ключах — старт через','Queue on our keys — starting in')+'</span><span class="t"></span><button type="button">'+L('Отмена','Cancel')+'</button>';
    document.body.appendChild(box); const tEl=box.querySelector('.t'); const end=Date.now()+q.wait*1000;
    const tick=function(){ const left=Math.max(0,Math.ceil((end-Date.now())/1000)); tEl.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
      if(left<=0){ clearInterval(iv); box.remove(); res(true); } };
    const iv=setInterval(tick,250); tick();
    box.querySelector('button').onclick=function(){ clearInterval(iv); box.remove(); res(false); }; }); }
  function wrapApi(){ if(typeof window.api!=='function'||window.api.__vrq)return; const a0=window.api;
    const na=function(method){ const args=arguments, kind=QUEUED[method], st=window.__vrShared;
      if(!kind||!st||!st.on||!st.ready) return a0.apply(this,args);
      let n=1; if(kind==='n'){ try{ n=method==='build_batch_from_preview'?5:String(args[1]||'').split('\n').filter(function(x){return x.trim();}).length||1; }catch(e){} }
      const self=this;
      return qJoin(n).then(qWait).then(function(go){ return go?a0.apply(self,args):{ok:false,msg:L('Отменено — очередь','Cancelled — queue')}; }); };
    na.__vrq=1; window.api=na; }
  // Правила веб-версии на двух языках (язык интерфейса): только то, что реально есть в браузере
  function rulesWeb(){
    const body=document.querySelector('#rulesModal .modal-body'); if(!body)return;
    const en=(typeof uiLang!=='undefined'&&uiLang==='en'), L=function(r,e){ return en?e:r; };
    const old=document.getElementById('vrRulesWeb'); if(old){ if(old.dataset.lang===(en?'en':'ru'))return; old.remove(); }
    const lite=!!document.querySelector('[data-i18n="rules_batch_h"]');
    const sec=function(cls,h,items){ return '<div class="rsec '+cls+'"><h4>'+h+'</h4><ul style="margin:6px 0 0 18px;padding:0">'+items.map(function(x){return '<li style="margin:4px 0">'+x+'</li>';}).join('')+'</ul></div>'; };
    const S=[];
    S.push(sec('c1',L('📱 ЧТО ДЕЛАЕТ ВИДЕОРИЛС','📱 WHAT VIDEORILS DOES'),[
      L('Делает вертикальные ролики 9:16 для TikTok, Reels и Shorts прямо в браузере телефона или компьютера: пишет сценарий, подбирает видео, озвучивает, ставит субтитры и собирает готовый ролик.','Makes vertical 9:16 videos for TikTok, Reels and Shorts right in your phone or computer browser: writes the script, picks footage, voices it, adds subtitles and assembles the finished reel.'),
      L('Устанавливать ничего не нужно. Готовый ролик — кнопка «⬇ Скачать ролик».','Nothing to install. The finished reel — the “⬇ Download reel” button.'),
      lite?L('Ролики до 120 секунд.','Reels up to 120 seconds.'):L('Ролики до 40 секунд (лучше 20–40).','Reels up to 40 seconds (20–40 works best).')
    ]));
    S.push(sec('c3',L('⚡ БЫСТРЫЙ СТАРТ','⚡ QUICK START'),[
      L('Впиши тему или свою историю (нет идей — «💡 Идеи дня»).','Type a topic or your own story (no ideas — “💡 Ideas of the day”).'),
      L('Выбери тип ролика или оставь «🤖 Авто», выбери длину.','Pick a reel type or leave “🤖 Auto”, choose the length.'),
      L('«🚀 Получить результат» — ИИ напишет сценарий и подберёт клипы под каждую фразу.','“🚀 Get result” — the AI writes the script and picks clips for every line.'),
      L('Проверь сцены, при желании поменяй голос, стиль субтитров, музыку.','Check the scenes; change the voice, subtitle style or music if you like.'),
      L('«Озвучить и собрать рилс» → «⬇ Скачать ролик».','“🎙️ Voice & build reel” → “⬇ Download reel”.')
    ]));

  // Ошибки у людей -> сервер (админка «Ошибки» + бот с причиной и решением). Одинаковое — 1 раз за сессию,
  // не больше 15 сообщений с одного браузера. Шум (расширения браузера, ResizeObserver) не шлём.
  const ERR_SEEN={}; let ERR_N=0;
  const ERR_IGN=/ResizeObserver loop|chrome-extension:|moz-extension:|safari-extension:|^Script error\.?$|Non-Error promise rejection captured|AbortError|The play\(\) request was interrupted|NotAllowedError: play\(\)/i;
  function repErr(type,msg,stage){
    try{ if(!/(^|[.])videorils[.]com$/.test(location.hostname))return;   // тесты с localhost в админку и Telegram не шлём
      msg=String(msg||'').replace(/\s+/g,' ').trim().slice(0,200); if(!msg||ERR_IGN.test(msg))return;
      if(/лицензи|license/i.test(msg)&&/триал|trial/i.test(msg))return;   // окно лицензии — не ошибка
      const k=type+'|'+msg; if(ERR_SEEN[k]||ERR_N>=15)return; ERR_SEEN[k]=1; ERR_N++;
      if(canApi()) api('report_client_error',type,msg,String(stage||'web').slice(0,24)); }catch(e){}
  }
  window.vrReportError=repErr;
  window.addEventListener('error',function(e){ if(!e||!e.message)return; const f=String(e.filename||''); if(ERR_IGN.test(f))return;
    repErr('js_error', e.message+' @'+f.split('/').pop()+':'+(e.lineno||0), 'page'); });
  window.addEventListener('unhandledrejection',function(e){ const r=e&&e.reason; repErr('js_promise', (r&&(r.message||r))||'', 'page'); });
  function wrapErrCallbacks(){
    const w=function(name,check){ const f=window[name]; if(typeof f!=='function'||f.__vre)return;
      const g=function(){ try{ check.apply(null,arguments); }catch(e){} return f.apply(this,arguments); }; g.__vre=1; window[name]=g; };
    w('transcribeDone',function(c,s,e){ if(e)repErr('transcribe_failed',e,'from_video'); });
    w('clipmixDone',function(p,err){ if(err)repErr('clipmix_failed',err,'clipmix'); });
    w('subsDone',function(p,err){ if(err)repErr('subs_failed',err,'subs_only'); });
    w('clipmixPreviewReady',function(r){ if(r&&r.ok===false)repErr('clipmix_preview_failed',r.msg||'','clipmix'); });
    w('batchDone',function(r){ if(r&&r.total&&r.done<r.total)repErr('batch_partial','собрано '+r.done+' из '+r.total,'batch'); });
    w('aiFail',function(r){ if(isGate(r)){ stat('paywall'); return; } repErr('ai_failed',(r&&(r.msg||r.error))||'нет ответа','get_result'); });
    w('edgeLimitAsk',function(){ repErr('tts_limit','бесплатный голос притормозил (Microsoft)','voice'); });
  }
  // ---------- статистика веб-версии (анонимно: событие + код браузера, без личных данных) ----------
  const STAT_URL='https://videorils-tts.videorils.workers.dev/web/ev';
  const STAT_P=/\/lite\//.test(location.pathname)?'lite':'mini';
  let STAT_OPEN=0;
  function stat(e){ try{ fetch(STAT_URL,{method:'POST',keepalive:true,headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({p:STAT_P,e:e,l:(typeof uiLang!=='undefined'&&uiLang==='en')?'en':'ru',src:statSrc(),sid:statSid(),dev:(matchMedia('(pointer:coarse)').matches||Math.min(screen.width,screen.height)<700)?'m':'d'})}).catch(function(){}); }catch(x){} }
  // источник визита — тот же, что посчитал счётчик сайта в этой вкладке (vrstat.js); зашли сразу в приложение — «прямой»
  function statSid(){ try{ let v=sessionStorage.getItem('vr_sv_sid'); if(!v){ v=Math.random().toString(36).slice(2,12); sessionStorage.setItem('vr_sv_sid',v); } return v; }catch(e){ return ''; } }
  function statSrc(){ try{ let v=sessionStorage.getItem('vr_sv_s'); if(v)return v;
      const q=new URLSearchParams(location.search); let h=''; try{ h=new URL(document.referrer).hostname; }catch(e){}
      v=q.get('yclid')?'yandex_ads':q.get('rb_clickid')?'vk_ads':q.get('gclid')?'google_ads':q.get('ttclid')?'tiktok_ads':(q.get('utm_source')||'').toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,24)
        ||(!h?'direct':/google[.]/.test(h)?'google':/yandex[.]|(^|[.])ya[.]ru$/.test(h)?'yandex':/(^|[.])ads[.]vk[.]com$/.test(h)?'vk_ads':/(^|[.])vk[.](com|ru)$/.test(h)?'vk':/tiktok[.]com$/.test(h)?'tiktok':/instagram[.]com$/.test(h)?'instagram':/youtube[.]com$|youtu[.]be$/.test(h)?'youtube':/(^|[.])t[.]me$|telegram/.test(h)?'telegram':/videorils[.]com$/.test(h)?'direct':'other');
      sessionStorage.setItem('vr_sv_s',v); return v; }catch(e){ return 'direct'; } }
  function statInit(){
    if(STAT_OPEN||!canApi())return; STAT_OPEN=1; stat('open');
    try{ const k='vr_stat_day_'+STAT_P, d=new Date().toISOString().slice(0,10); if(localStorage.getItem(k)!==d){ localStorage.setItem(k,d); stat('visitor'); } }catch(e){}
  }
  window.vrStat=stat;
  const STAT_EV={ai_generate_reel:'get_result',batch_preview:'get_result',clipmix_preview:'get_result',
    build_reel:'build',build_clipmix:'build',build_batch:'build',build_batch_from_preview:'build',build_subs_only:'build'};
  const isGate=function(r){ return !!(r&&(r.need_license||(r.ok===false&&/лицензи|license/i.test(String(r.msg||''))&&/триал|trial/i.test(String(r.msg||''))))); };
  function wrapStat(){
    if(typeof window.api!=='function'||window.api.__vrs)return; const a0=window.api;
    const na=function(method){ const ev=STAT_EV[method]; if(ev)stat(ev);
      const out=a0.apply(this,arguments);
      if(ev&&out&&typeof out.then==='function') out.then(function(r){ if(isGate(r))stat('paywall'); }).catch(function(){});
      // реальная оплата: сервер подтвердил платёж и выдал ключ (один раз на вкладку)
      if(method==='check_payment'&&out&&typeof out.then==='function') out.then(function(r){ if(r&&r.paid&&!window.__vrPaidStat){ window.__vrPaidStat=1; stat('paid'); } }).catch(function(){});
      return out; };
    na.__vrs=1; window.api=na;
    const w=function(name,fn){ const f=window[name]; if(typeof f!=='function'||f.__vrs)return;
      const g=function(){ try{ fn.apply(null,arguments); }catch(e){} return f.apply(this,arguments); }; g.__vrs=1; window[name]=g; };
    const done=function(ok){ if(!ok)return; stat('reel_done'); try{ if(window.__vrApi&&!window.__vrApi.licensed)stat('trial_reel'); }catch(e){} };
    w('reelDone',function(path){ done(!!path); });
    w('clipmixDone',function(path){ done(!!path); });
    w('batchDone',function(r){ if(r&&r.done)for(let i=0;i<r.done;i++)done(true); });
    w('startPurchase',function(){ stat('pay_click'); });
    w('startBuy',function(){ stat('pay_click'); });
  }
  function langSync(){
    try{
      const q=new URLSearchParams(location.search).get('lang');
      if((q==='en'||q==='ru')&&typeof setUiLang==='function'&&typeof uiLang!=='undefined'&&uiLang!==q&&canApi()) setUiLang(q);
      if(typeof uiLang==='undefined')return;
      const en=(uiLang==='en'); _buildVariant=en?'en':'ru';
      // английский интерфейс = английская версия: ролик всегда на английском, тумблер «Рилс на английском» не нужен
      ['btnLangReel','btnLangBatch'].forEach(function(id){ const b=document.getElementById(id); if(b)b.style.display=en?'none':''; });
      const cb=document.getElementById('cbLangReel'); let was=''; try{ was=localStorage.getItem('vr_web_lang')||''; }catch(e){}
      if(canApi()&&typeof onContentLang==='function'&&cb){
        if(en&&!cb.checked) onContentLang(true);
        else if(!en&&was==='en'&&cb.checked) onContentLang(false);   // вернулись на русскую версию
      }
      const de=document.documentElement;
      let stale=0; document.querySelectorAll('.vrShared,#groqAccHead,#groqAccBody,.vrStockOpt').forEach(function(e){ if(e.dataset.lang!==uiLang){ e.remove(); stale=1; } });
      if((stale||(de.dataset.vrUi&&de.dataset.vrUi!==uiLang))&&canApi()){ try{ if(typeof loadKeysStatus==='function')loadKeysStatus(); }catch(e){} }
      { const dt=document.getElementById('groqDot'); if(dt&&dt.dataset.n!=null&&typeof t==='function') dt.textContent=(+dt.dataset.n)?t('key_set'):t('key_not_set'); }
      de.dataset.vrUi=uiLang; try{ if(typeof subVisSync==='function')subVisSync(); }catch(e){}
      if(canApi()) try{ localStorage.setItem('vr_web_lang',uiLang); }catch(e){}
    }catch(e){}
  }
  // окно лицензии: поле «Уже купил? Введи ключ» видно сразу (сразу под согласием), промокод — отдельной кнопкой, не тут
  // окно лицензии: тексты, вписанные прямо в HTML (без перевода) — на языке интерфейса
  function licTexts(){
    try{
      document.querySelectorAll('button[onclick^="copyLicKey"]').forEach(function(bt){ if(!/✓/.test(bt.textContent)) bt.textContent=L('📋 Скопировать ключ','📋 Copy key'); });
      document.querySelectorAll('.vrLicRightHead').forEach(function(h){ h.textContent=L('💳 Тарифы — оплата сразу','💳 Plans — pay now'); });
      ['licKeyHint','licstKeyHint'].forEach(function(id){ const e=document.getElementById(id); if(e) e.textContent=L('Сохраните ключ — с ним лицензия восстанавливается в браузере на этом устройстве.','Save this key — it restores your license in the browser on this device.'); });
      const f=window.copyLicKey;
      if(typeof f==='function'&&!f.__vrt){ const g=function(btn,src){ const k=((document.getElementById(src||'licKeyFull')||{}).textContent||'').trim(); if(!k||k==='—')return;
          api('copy_text',k).then(function(){ const o=btn.textContent; btn.textContent=L('✓ Скопировано','✓ Copied'); setTimeout(function(){ btn.textContent=o; },1600); }).catch(function(){}); };
        g.__vrt=1; window.copyLicKey=g; }
    }catch(e){}
  }
  function licFix(){
    const box=document.getElementById('licActivateBox'), cb=document.getElementById('consentBox'), lp=document.getElementById('licPlans');
    if(!box||box.dataset.vrfix)return; box.dataset.vrfix='1';
    // слева: согласие, триал, «Уже купил? Введи ключ»
    const after=document.getElementById('trialBox')||document.getElementById('gatedActivation')||cb;
    if(after&&after.parentNode) after.parentNode.insertBefore(box, after.nextSibling);
    // справа: тарифы с «Оплатить» — отдельной колонкой окна, сразу видно
    const cols=lp&&lp.closest('.licCols');
    if(cols&&!document.getElementById('vrLicRight')){
      const right=document.createElement('div'); right.className='reelCol vrLicRight'; right.id='vrLicRight';
      const block=lp.closest('.rsec')||lp;      // Мини — секция с заголовком, Лайт — сами карточки
      if(block===lp){ const h=document.createElement('h4'); h.className='vrLicRightHead'; h.textContent=L('💳 Тарифы — оплата сразу','💳 Plans — pay now'); right.appendChild(h); }
      right.appendChild(block); const sb=document.getElementById('scarBanner'); if(sb&&block===lp) right.appendChild(sb);
      cols.appendChild(right);
    }
    const f=window.doActivate;
    if(typeof f==='function'&&!f.__vrc){ const g=function(){ if(typeof requireConsent==='function'&&!requireConsent())return; return f.apply(this,arguments); }; g.__vrc=1; window.doActivate=g; }
  }
  // без лицензии всё нужное видно сразу: триал, тарифы, ключ (согласие спросим при нажатии — requireConsent)
  function licShowAll(){
    try{ ['returningNote','licTrialUsed'].forEach(function(id){ const e=document.getElementById(id); if(e&&/этом ПК|this PC/.test(e.textContent)) e.textContent=e.textContent.replace(/на этом ПК/g,'в этом браузере').replace(/this PC/g,'this browser'); });
      if(typeof access==='undefined'||access.licensed)return;
      const g=document.getElementById('gatedActivation'); if(g) g.style.display='block';                 // Мини: триал + ключ
      const lp=document.getElementById('licPlans'); if(lp&&lp.style.display==='none') lp.style.display=/\/lite\//.test(location.pathname)?'flex':''; // Лайт: тарифы
    }catch(e){}
  }
  // открыли окно лицензии — тарифы рисуем СРАЗУ (запомненные/базовые цены), не дожидаясь ответа сервера
  function licPlansNow(){ try{ const lp=document.getElementById('licPlans'); if(lp&&!lp.querySelector('.vrSub')&&typeof window.renderPlans==='function') window.renderPlans(); }catch(e){} }
  function licOpenWrap(){ ['openLic','showLic'].forEach(function(n){ const f=window[n]; if(typeof f!=='function'||f.__vro)return;
      const g=function(){ const r=f.apply(this,arguments); licFix(); licTexts(); licPlansNow(); setTimeout(licPlansNow,400); setTimeout(licTexts,600); return r; }; g.__vro=1; window[n]=g; }); }
  function licGateWrap(){ licOpenWrap(); const f=window.applyConsentGate; if(typeof f!=='function'||f.__vrg)return;
    const g=function(){ const r=f.apply(this,arguments); licShowAll(); licRightToggle(); return r; }; g.__vrg=1; window.applyConsentGate=g; }
  // «Навсегда» — покупать нечего: правую колонку тарифов прячем целиком (без пустого заголовка)
  function licRightToggle(){ try{ const r=document.getElementById('vrLicRight'); if(!r||typeof access==='undefined')return; const life=access.licensed&&(access.key_type||'lifetime')==='lifetime'; r.style.display=life?'none':''; }catch(e){} }
  function boot(){ langSync(); licFix(); licTexts(); licGateWrap(); wrapStat(); statInit(); hook(); stockOpt(); sharedBox(); groqBox(); wrapT(); wrapApi(); rulesWeb(); wrapErrCallbacks(); wrap('openRules',function(){ rulesWeb(); }); if(canApi())api('get_shared_state').then(function(st){ if(st){ window.__vrShared=st; trialMode(st); } });
    wrap('renderReelAi',function(){ aiDropdown(document.getElementById('reelAiTabs')); aiDropdown(document.getElementById('cmAiTabs')); });
    aiDropdown(document.getElementById('reelAiTabs')); aiDropdown(document.getElementById('cmAiTabs')); }
  hook(); document.addEventListener('DOMContentLoaded',boot); window.addEventListener('pywebviewready',function(){ boot(); setTimeout(boot,300); }); [1500,4000,8000].forEach(function(t){ setTimeout(boot,t); });
  window.vrReelCredits=function(box){
    if(!box||!canApi())return;
    let d=box.querySelector('.vrReelCredits');
    if(!d){ d=document.createElement('div'); d.className='vrReelCredits'; box.appendChild(d); }
    d.innerHTML='';
    api('get_reel_credits',(box.id==='cmResultBox'||box.id==='cmColRight')?'clipmix':'').then(function(r){
      const l=(r&&r.credits)||[]; if(!l.length)return;
      const src=[...new Set(l.map(function(c){return c.source;}))].join(' · ');
      d.innerHTML='🎞 <b>'+L('Кадры','Footage')+' ('+esc(src)+'):</b> '+l.map(credit).join(', ');
    }).catch(function(){});
  };
})();
